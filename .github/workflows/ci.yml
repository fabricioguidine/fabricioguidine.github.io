name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Jekyll site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: _site
          retention-days: 7

  html-lint:
    name: HTML lint (source + built)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node deps
        run: npm install --no-audit --no-fund
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: HTMLHint (source templates)
        run: npx htmlhint "**/*.html" --ignore "node_modules/**,_site/**,vendor/**"
      - name: html-validate (built output)
        run: npx html-validate "_site/**/*.html"

  spell-check:
    name: Spell check (EN + PT-BR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run cspell
        run: npx --yes cspell "**/*.{md,html,yml}" --no-progress

  link-check:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-loopback './_site/**/*.html' './**/*.md'
          fail: true

  accessibility:
    name: Accessibility (pa11y-ci)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node deps
        run: npm install --no-audit --no-fund
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Serve built site
        run: npx --yes http-server _site -p 4000 -s &
      - name: Wait for server
        run: npx --yes wait-on http://localhost:4000 --timeout 30000
      - name: Run pa11y-ci
        run: npx pa11y-ci --config .pa11yci.json

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Node deps
        run: npm install --no-audit --no-fund
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: _site
      - name: Run Lighthouse CI
        run: npx lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
